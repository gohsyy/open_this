<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <title>Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    /* FULL SCREEN VIDEO */
    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #000;
    }

    /* SMALL HINT */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: 58px;

      transform: translateX(-50%);

      z-index: 9999;

      color: rgba(255, 255, 255, 0.2);

      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.5px;

      white-space: nowrap;
      pointer-events: none;

      text-shadow:
        0 1px 4px rgba(0,0,0,0.55),
    }

    /* LITTLE ARROW ANIMATION */
    .arrow {
      display: inline-block;
      margin-right: 4px;
      animation: moveDown 1.6s ease-in-out infinite;
    }

    @keyframes moveDown {
      0%, 100% {
        transform: translateY(-2px);
        opacity: 0.45;
      }

      50% {
        transform: translateY(3px);
        opacity: 0.9;
      }
    }

    /* SAVE AREA */
    .save-section {
      width: 100%;
      min-height: 190px;

      background: #000;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding:
        35px
        20px
        calc(35px + env(safe-area-inset-bottom));
    }

    .save-button {
      width: 100%;
      max-width: 380px;

      padding: 16px 25px;

      border: none;
      border-radius: 50px;

      background: #fff;
      color: #000;

      font-size: 16px;
      font-weight: 600;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

      cursor: pointer;

      -webkit-appearance: none;
      appearance: none;
    }

    .save-button:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    .save-button:disabled {
      opacity: 0.55;
    }

    .save-info {
      margin-top: 12px;

      color: rgba(255,255,255,0.4);

      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>

  <section class="video-container">

    <video
      id="mainVideo"
      autoplay
      playsinline
      controls
      preload="auto"
    >
      <source src="video.mp4" type="video/mp4">
    </video>

    <div class="scroll-hint">
      <span class="arrow">↓</span>
      swipe down to save
    </div>

  </section>


  <section class="save-section">

    <button
      id="saveButton"
      class="save-button"
      onclick="saveVideo()"
    >
      Save Video
    </button>

    <div class="save-info">
      iPhone · choose Save Video from the share menu
    </div>

  </section>


  <script>
    async function saveVideo() {

      const button =
        document.getElementById("saveButton");

      try {

        button.disabled = true;
        button.innerText = "Preparing video...";

        const response =
          await fetch("video.mp4");

        if (!response.ok) {
          throw new Error("Unable to load video");
        }

        const blob =
          await response.blob();

        const file =
          new File(
            [blob],
            "video.mp4",
            { type: "video/mp4" }
          );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {

          await navigator.share({
            files: [file],
            title: "Video"
          });

        } else {

          const url =
            URL.createObjectURL(blob);

          const link =
            document.createElement("a");

          link.href = url;
          link.download = "video.mp4";

          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 1500);
        }

      } catch (error) {

        if (error.name !== "AbortError") {
          alert(
            "Please use the browser Share button and choose Save Video."
          );
        }

      } finally {

        button.disabled = false;
        button.innerText = "Save Video";

      }
    }
  </script>

</body>
</html>
